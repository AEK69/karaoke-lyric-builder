# Firebase App Hosting — runs the TanStack Start (Nitro `node-server`) SSR build
# on Cloud Run. Build step runs `npm run build` (-> .output/), start runs `npm start`
# which launches .output/server/index.mjs on $PORT.
# Docs: https://firebase.google.com/docs/app-hosting/configure

runConfig:
  minInstances: 0
  maxInstances: 2
  concurrency: 80
  cpu: 1
  memoryMiB: 512

env:
  # --- Public Supabase config (anon/publishable key is safe to expose) ---
  # VITE_* are baked into the client bundle at BUILD time.
  - variable: VITE_SUPABASE_URL
    value: https://vositjjwzclxwtrstyzj.supabase.co
    availability:
      - BUILD
      - RUNTIME
  - variable: VITE_SUPABASE_PUBLISHABLE_KEY
    value: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZvc2l0amp3emNseHd0cnN0eXpqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODEyOTMzNjUsImV4cCI6MjA5Njg2OTM2NX0.Ge2ZOC0aUA6hdFJ419Zd-MObirD--ES6g6LoyHANs78
    availability:
      - BUILD
      - RUNTIME

  # --- Server reads the non-VITE_ names at RUNTIME ---
  - variable: SUPABASE_URL
    value: https://vositjjwzclxwtrstyzj.supabase.co
    availability:
      - RUNTIME
  - variable: SUPABASE_PUBLISHABLE_KEY
    value: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZvc2l0amp3emNseHd0cnN0eXpqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODEyOTMzNjUsImV4cCI6MjA5Njg2OTM2NX0.Ge2ZOC0aUA6hdFJ419Zd-MObirD--ES6g6LoyHANs78
    availability:
      - RUNTIME

  # --- Secret: service role key (bypasses RLS) — stored in Cloud Secret Manager ---
  # Create it with:  firebase apphosting:secrets:set SUPABASE_SERVICE_ROLE_KEY
  - variable: SUPABASE_SERVICE_ROLE_KEY
    secret: SUPABASE_SERVICE_ROLE_KEY
    availability:
      - RUNTIME
