name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: Lint · Typecheck · Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
        env:
          # .env.production is gitignored; these anon-tier values only need to be
          # present so the Supabase client constructor doesn't throw at prerender.
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: ci_dummy_anon_key
          VITE_GOOGLE_CLIENT_ID: ci_dummy
          SUPABASE_URL: https://example.supabase.co
          SUPABASE_PUBLISHABLE_KEY: ci_dummy_anon_key

  live-db-check:
    name: Live DB schema check (non-blocking)
    runs-on: ubuntu-latest
    # Verifies every RPC/table the app calls exists on the live DB — catches
    # "migration written but never applied". Needs repo secrets SUPABASE_URL and
    # SUPABASE_PUBLISHABLE_KEY (the public anon key); skips gracefully if unset.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Probe live RPCs
        run: node scripts/check-live-rpcs.mjs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
